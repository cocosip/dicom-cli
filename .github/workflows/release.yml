name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build release archives
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          output="$GITHUB_WORKSPACE/dist"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          mkdir -p "$output"

          package_target() {
            local goos="$1"
            local goarch="$2"
            local archive="$3"
            local package="dicom-cli_${version}_${goos}_${goarch}"
            local stage="$staging/$package"
            local binary="dicom-cli"

            if [[ "$goos" == "windows" ]]; then
              binary+=".exe"
            fi

            mkdir -p "$stage/docs" "$stage/examples"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$stage/$binary" ./cmd/dicom-cli
            cp README.md "$stage/"
            cp docs/usage.md "$stage/docs/"
            cp examples/dicom-cli.yaml "$stage/examples/"
            cp examples/dicom-cli-rules.yaml "$stage/examples/"

            if [[ "$archive" == "zip" ]]; then
              (cd "$staging" && zip -qr "$output/$package.zip" "$package")
            else
              (cd "$staging" && tar -czf "$output/$package.tar.gz" "$package")
            fi
          }

          package_target windows amd64 zip
          package_target linux amd64 tar.gz
          package_target linux arm64 tar.gz
          package_target darwin amd64 tar.gz
          package_target darwin arm64 tar.gz

      - name: Smoke test Linux archive
        shell: bash
        run: |
          mkdir smoke
          tar -xzf "dist/dicom-cli_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz" -C smoke
          "smoke/dicom-cli_${GITHUB_REF_NAME#v}_linux_amd64/dicom-cli" --help

      - name: Generate changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          CURR_TAG=$GITHUB_REF_NAME
          {
            echo "## What's Changed"
            echo ""
            git log "${PREV_TAG}..HEAD" --pretty=tformat:"- %s" --no-merges
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURR_TAG}"
          } > CHANGELOG_BODY.md
          cat CHANGELOG_BODY.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/dicom-cli_${GITHUB_REF_NAME#v}_windows_amd64.zip" \
            "dist/dicom-cli_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz" \
            "dist/dicom-cli_${GITHUB_REF_NAME#v}_linux_arm64.tar.gz" \
            "dist/dicom-cli_${GITHUB_REF_NAME#v}_darwin_amd64.tar.gz" \
            "dist/dicom-cli_${GITHUB_REF_NAME#v}_darwin_arm64.tar.gz" \
            --notes-file CHANGELOG_BODY.md --title "$GITHUB_REF_NAME"
